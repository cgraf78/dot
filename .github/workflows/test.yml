name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
    with:
      # Full matrix on every PR: scheduled-only legs let main break
      # silently between daily runs and cannot validate their fixes.
      matrix-set: full
      # rust-version is a compatibility promise, so exercise it inside the
      # shared required gate instead of leaving it aspirational. The shared
      # defaults own Clippy's locked all-target/all-feature scope, rustdoc
      # missing-doc lint, fmt, audit, and the default `cargo test --locked`
      # invocation; local copies would drift.
      msrv-toolchain: "1.85"
      # Wall-clock tests run once, in release mode, in the dedicated Ubuntu
      # performance job below. Keep the portable matrix deterministic.
      #
      # Run the Cargo suites and the native-backed shell acceptance suites as
      # parallel jobs on every platform. Serially they bounded the macOS leg
      # at roughly their sum; the two halves are close to balanced. Each shard
      # starts from a fresh runner, so the acceptance shard builds the debug
      # `dot` binary that `bin/dot` and the suites execute.
      test-shards: |
        [
          {"name": "cargo", "command": "cargo test --locked"},
          {"name": "acceptance", "command": "cargo build --locked\nbash tests/run\nbash tests/release-scripts-test"}
        ]
      # Formatting is platform-independent, so check it once on the
      # Ubuntu quality gate (which installs the rustfmt component)
      # instead of on every platform container. The two supervisor
      # sources compile outside Cargo targets, so `cargo fmt` skips
      # them and they need the explicit `rustfmt` line.
      fmt-command: |
        cargo fmt --check
        rustfmt --edition 2024 --check support/performance-command-supervisor.rs tests/support/performance-supervisor-fixture.rs
      # Native integration tests retain the public Python timeout helper as an
      # external-suite compatibility boundary. Minimal Rust images do not
      # otherwise install its interpreter. The process-supervision tests
      # shell out to `ps` (portable snapshot fallback, start-identity
      # probe) and the hook-merge tests validate through `jq`; install
      # both so every platform exercises the strict path.
      profiles: python,procps,jq
      # User-authored hooks retain a versioned Bash 4+ API. A brewed Bash lands
      # on the default macOS PATH; the native engine itself has no shell
      # interpreter dependency.
      setup-command: |
        # `brew --prefix` alone is not a reliable installed check, so require
        # the executable itself.
        if [ "$(uname -s)" = Darwin ]; then
          brew_prefix=$(brew --prefix bash 2>/dev/null || true)
          if [ -z "$brew_prefix" ] || [ ! -x "$brew_prefix/bin/bash" ]; then
            brew install bash
          fi
        fi
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        archive=$(scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl)
        scripts/smoke-release.sh linux-x86_64-musl
        install_root=$(mktemp -d "$RUNNER_TEMP/dot-install.XXXXXX")
        HOME="$install_root/home" ./install.sh \
          --archive "$archive" --checksum "$archive.sha256" \
          --data-home "$install_root/data" --bin-dir "$install_root/bin"
        "$install_root/bin/dot" version
      # Termux hardware is too slow and variable for wall-clock performance
      # gates, so the emulator runs the transported release-mode binary's CLI
      # contract only (no cargo in the sandbox).
      termux-command: scripts/termux-ci.sh
      # The lifecycle smoke invokes `dot test`, whose parity contract requires
      # a trusted system Git before it launches any suite.
      termux-profiles: base
      termux-host-command: |
        # Build outside the checkout: the emulator copy step tars the
        # whole caller tree, and in-tree target/ hardlinks break that
        # copy with permission errors (sibling convention uses
        # $RUNNER_TEMP target dirs for the same reason).
        export CARGO_TARGET_DIR="$RUNNER_TEMP/dot-termux-target"
        # Compile every test target under Android cfg even though the emulator
        # runs only the transported release CLI contract.
        cargo check --locked --tests --target "$RUST_TARGET"
        archive=$(scripts/package-release.sh "$RUST_TARGET" android-x86_64)
        scripts/smoke-release.sh android-x86_64
        mkdir -p .termux-ci
        tar -C .termux-ci -xzf "$archive"

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
    with:
      matrix-set: full
      profiles: base,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      # This job deliberately has no Rust toolchain. Exercise the retained
      # sourceable shell API here; the native-backed full acceptance suite runs
      # in the Rust platform job after Cargo has built `dot`.
      test-command: bash tests/library-test
      termux-profiles: base,python

  shdeps-lock:
    name: Verify Shdeps lock
    runs-on: ubuntu-24.04
    # The raw installer fetch has a roughly 95-second inner maximum. Keep the
    # singleton job bounded while leaving ample checkout and runner margin.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify changed Shdeps lock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: scripts/verify-shdeps-lock --if-changed "$EVENT_NAME" "$BASE_SHA"

  performance:
    name: Performance / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          # The shell baseline is a reachable ancestor of the port stack. A
          # shallow checkout cannot construct its independent source clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify performance source provenance
        run: bash tests/provenance-test

      - name: Compare release performance with the shell baseline
        id: benchmark
        shell: bash
        env:
          DOT_PERF_ARTIFACT_DIR: ${{ runner.temp }}/dot-performance
        run: scripts/benchmark-port.sh

      - name: Confirm sealed performance publication
        shell: bash
        env:
          DOT_PERF_PUBLICATION_DIR: ${{ steps.benchmark.outputs.publication_dir }}
        run: scripts/benchmark-port.sh --validate-publication "$DOT_PERF_PUBLICATION_DIR"

      - name: Upload performance evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: dot-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.benchmark.outputs.publication_dir }}/driver.tsv
            ${{ steps.benchmark.outputs.publication_dir }}/metadata.tsv
            ${{ steps.benchmark.outputs.publication_dir }}/samples.tsv
            ${{ steps.benchmark.outputs.publication_dir }}/summary.tsv
            ${{ steps.benchmark.outputs.publication_dir }}/calibration.tsv
            ${{ steps.benchmark.outputs.publication_dir }}/completion.tsv
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: ${{ always() }}
    needs: [performance, shell, shdeps-lock, rust]
    runs-on: ubuntu-24.04
    env:
      PERFORMANCE_RESULT: ${{ needs.performance.result }}
      SHELL_RESULT: ${{ needs.shell.result }}
      SHDEPS_LOCK_RESULT: ${{ needs.shdeps-lock.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Require all compatibility checks
        shell: bash
        run: |-
          printf 'Performance: %s\n' "$PERFORMANCE_RESULT"
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Shdeps lock: %s\n' "$SHDEPS_LOCK_RESULT"
          printf 'Rust port: %s\n' "$RUST_RESULT"
          test "$PERFORMANCE_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$SHDEPS_LOCK_RESULT" = success
          test "$RUST_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
