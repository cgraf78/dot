name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      # rust-version is a compatibility promise, so exercise it inside the
      # shared required gate instead of leaving it aspirational. The shared
      # defaults own Clippy's locked all-target/all-feature scope, rustdoc
      # missing-doc lint, fmt, audit, and the default `cargo test --locked`
      # invocation; local copies would drift.
      msrv-toolchain: "1.85"
      # Perf budgets are calibrated on a fast host and must run at
      # multiplier 1 in CI, including the #[ignore]-gated heavy tests
      # (none in slice 1; the slice-2 update harness joins them
      # automatically). The multiplier env exists for slow developer
      # hosts only and gate jobs must not raise it.
      test-command: >-
        cargo test --locked &&
        DOT_PERF_BUDGET_MULTIPLIER=1 cargo test --locked -- --ignored
      # Slice 1 has no release/packaging scripts yet, so the Android and
      # Termux gates validate what exists: cross-compilation and the
      # native test suite. Packaging smoke arrives with the release
      # workflow in a later slice.
      android-package-smoke-command: |
        cargo build --locked --target "$RUST_TARGET"
        test -x "target/$RUST_TARGET/debug/dot"
      # Termux hardware is too slow and variable for wall-clock perf
      # budgets (p95-over-30 at 25/30ms), so the emulator runs unit and
      # CLI-parity tests only; perf budgets are a fast-host gate.
      termux-command: cargo test --locked --lib --bins --test cli

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      matrix-set: full
      profiles: base,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: bash tests/run
      termux-profiles: base,python

  macos-bash32:
    name: Stock macOS Bash 3.2 bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify stock Bash cannot satisfy the runtime contract
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          for script in \
            install.sh \
            bin/dot \
            support/checkout-bash-v1.sh \
            support/client-launcher.sh \
            support/install-checkout.sh \
            support/post-install.sh \
            lib/dot/public/api-version.sh \
            lib/dot/public/test-reporter-v1 \
            lib/dot/public/ui.sh \
            lib/dot/public/xdg.sh; do
            /bin/bash -n "$script"
          done

          state="$RUNNER_TEMP/stock-only-state"
          set +e
          output=$(XDG_STATE_HOME="$state" /bin/bash -c '
            . "$1"
            checkout_bash_v1_select dot /bin/bash
          ' -- support/checkout-bash-v1.sh 2>&1)
          status=$?
          set -e
          [[ $status -ne 0 ]]
          [[ $output == *'explicit interpreter is not Bash 4 or newer'* ]]
          [[ ! -e "$state" && ! -L "$state" ]]

      - name: Provision a separate modern Bash candidate
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          modern_prefix=$(brew --prefix bash 2>/dev/null || true)
          modern_bash=${modern_prefix:+$modern_prefix/bin/bash}
          if [[ -z "$modern_bash" || ! -x "$modern_bash" ]]; then
            brew install bash
            modern_prefix=$(brew --prefix bash)
            modern_bash="$modern_prefix/bin/bash"
          fi
          "$modern_bash" --noprofile --norc -c \
            'test "${BASH_VERSINFO[0]}" -ge 4'
          printf 'DOT_TEST_MODERN_BASH=%s\n' "$modern_bash" >>"$GITHUB_ENV"

      - name: Pipe installer through stock Bash and run the trampoline
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          origin="$RUNNER_TEMP/dot-origin.git"
          git init --quiet --bare "$origin"
          git -C "$origin" config receive.shallowUpdate true
          git -C "$origin" symbolic-ref HEAD refs/heads/main
          git push --quiet "$origin" HEAD:refs/heads/main

          prefix="$RUNNER_TEMP/dot-bash32"
          managed="$RUNNER_TEMP/managed/cgraf78/dot"
          state="$RUNNER_TEMP/runtime-state"
          HOME="$RUNNER_TEMP/home" PREFIX="$prefix" XDG_STATE_HOME="$state" \
            CGRAF78_CHECKOUT_INSTALL_BASH="$DOT_TEST_MODERN_BASH" \
            CGRAF78_CHECKOUT_INSTALL_DIR="$managed" \
            CGRAF78_CHECKOUT_INSTALL_REPO_URL="file://$origin" \
            /bin/bash -s <install.sh
          [[ -d "$managed/.git" ]]
          [[ -L "$prefix/bin/dot" ]]
          HOME="$RUNNER_TEMP/home" XDG_STATE_HOME="$state" \
            /bin/bash "$prefix/bin/dot" --version

  shdeps-lock:
    name: Verify Shdeps lock
    runs-on: ubuntu-24.04
    # The raw installer fetch has a roughly 95-second inner maximum. Keep the
    # singleton job bounded while leaving ample checkout and runner margin.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify changed Shdeps lock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: scripts/verify-shdeps-lock --if-changed "$EVENT_NAME" "$BASE_SHA"

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32, shdeps-lock, rust]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
      SHDEPS_LOCK_RESULT: ${{ needs.shdeps-lock.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Require all compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"
          printf 'Shdeps lock: %s\n' "$SHDEPS_LOCK_RESULT"
          printf 'Rust port: %s\n' "$RUST_RESULT"
          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success
          test "$SHDEPS_LOCK_RESULT" = success
          test "$RUST_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@b97bd729afec784785bd01ebd43321225ef47bb7
