# Spelling policy for typos (run by the local Checkrun/Sley hooks).
#
# Ignore only the deliberate misspellings that tests and docs need, by exact
# text, so the words themselves stay checked everywhere else.

[default]
extend-ignore-re = [
  # Misspelled config keys that exercise the "did you mean" suggestion.
  "defualt_profile",
  "dependency_provder",
  "shdeps_update_polciy",
  '"versoin"',
  # Truncated and non-UTF-8 command words in CLI dispatch tests.
  'b"updat"',
  '"fo\\xFFb"',
]
