# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed by release-lib.sh after sourcing
#
# Dot-specific inputs to the shared release scripts vendored from
# cgraf78/actions. Shared release behavior belongs in release-lib.sh.

RELEASE_ENV_PREFIX=DOT
RELEASE_SLUG='dot'
RELEASE_REPO=cgraf78/dot
RELEASE_ASSET_NAME='dot'
RELEASE_BINARY='dot'

RELEASE_PAYLOAD_FILES=(
  README.md
  LICENSE
)

# These language-neutral APIs are the only lib/dot assets required by external
# hook and test-suite consumers. The private Bash engine is never packaged.
RELEASE_PAYLOAD_DIRS=(
  lib/dot/public
)
